name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test.js

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: App icon and splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#1e2e40' --iconBackgroundColorDark '#1e2e40' --splashBackgroundColor '#0f1820' --splashBackgroundColorDark '#0f1820'
      - run: node tools/patch-android.js
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
      - run: npx cap sync android
      - run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android
      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks build/release.keystore --ks-key-alias farm --ks-pass pass:farm-release --key-pass pass:farm-release --out ServerFarm.apk aligned.apk
          "$BT/apksigner" verify --verbose ServerFarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ServerFarm.apk
          if-no-files-found: error

  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Server Farm 1.0.${{ github.run_number }}
          body: |
            **Android:** `ServerFarm.apk`. Open it on your phone and allow installs from this source when asked. Installing a newer build over an older one keeps your save.
          files: out/*
